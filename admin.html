<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>POS Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>[v-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-100 p-6 font-sans">

<div id="app" v-cloak class="max-w-7xl mx-auto space-y-6">
  <!-- 标头 -->
  <header class="bg-slate-900 text-white p-5 rounded-2xl shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-black">🖥️ 柜台订单控制台</h1>
      <p class="text-xs text-slate-400 mt-1">按桌合并显示 · 独立发票结账</p>
    </div>
    <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full font-bold">● 系统运行中</span>
  </header>

  <!-- 桌号列表 -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div v-for="(orders, tableNo) in tableGroups" :key="tableNo" class="bg-white rounded-2xl shadow border p-5 flex flex-col justify-between space-y-4">
      
      <div>
        <div class="flex justify-between items-center border-b pb-3">
          <span class="bg-amber-500 text-white font-black text-2xl px-3 py-1 rounded-xl">
            TABLE: {{ tableNo }}
          </span>
          <span class="text-xs font-bold bg-slate-100 text-slate-600 px-2 py-1 rounded-lg">
            加单 {{ orders.length }} 次
          </span>
        </div>

        <!-- 菜品列表 -->
        <div class="mt-4 space-y-2 max-h-60 overflow-y-auto">
          <div v-for="item in getCombinedItems(orders)" :key="item.name" class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border text-sm">
            <span class="font-bold text-slate-800">{{ item.name }}</span>
            <span class="font-black text-amber-600">x{{ item.qty }}</span>
          </div>
        </div>
      </div>

      <!-- 结账卡片底部 -->
      <div class="border-t pt-3 space-y-3">
        <div class="flex justify-between items-center font-black">
          <span class="text-slate-500">全单总额:</span>
          <span class="text-2xl text-emerald-600">RM {{ getTableGrandTotal(orders).toFixed(2) }}</span>
        </div>

        <button @click="startCheckout(tableNo, orders)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl shadow transition">
          💳 结账并打印发票
        </button>
      </div>

    </div>

    <div v-if="Object.keys(tableGroups).length === 0" class="col-span-full text-center py-20 bg-white rounded-2xl border text-slate-400 font-bold">
      🍵 当前没有待结账桌号
    </div>
  </div>

  <!-- 结账弹窗 -->
  <div v-if="currentTable" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-5">
      <h3 class="text-xl font-black border-b pb-2">桌号 {{ currentTable }} 结账</h3>
      
      <div class="text-center bg-emerald-50 py-3 rounded-2xl border border-emerald-100">
        <div class="text-xs text-emerald-600 font-bold">应收总计</div>
        <div class="text-3xl font-black text-emerald-700">RM {{ currentTotal.toFixed(2) }}</div>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-600">选择支付方式：</label>
        <div class="grid grid-cols-2 gap-2">
          <button v-for="m in ['Cash', 'QR Pay', 'Visa', 'MasterCard']" :key="m"
                  @click="payMethod = m"
                  :class="['py-2.5 text-xs font-bold rounded-xl border transition', payMethod === m ? 'bg-amber-500 text-white border-amber-500 shadow' : 'bg-slate-50 text-slate-700']">
            {{ m }}
          </button>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button @click="currentTable = null" class="w-1/2 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-xs">取消</button>
        <button @click="finishCheckout" class="w-1/2 bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs shadow">确认支付并清除</button>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://tswfrncmfidrbndfvimb.supabase.co"; 
  const SUPABASE_KEY = "sb_publishable_85XhLrnf93uEZPuPXOEuqA_7UeG9Wm_";
  const { createApp, ref, computed, onMounted } = Vue;

  createApp({
    setup() {
      const pendingOrders = ref([]);
      const currentTable = ref(null);
      const currentOrders = ref([]);
      const payMethod = ref('Cash');
      let client = null;

      const loadOrders = async () => {
        if (!client) client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data } = await client.from('orders')
          .select('*')
          .eq('status', 'Pending')
          .is('is_invoice', null);
        pendingOrders.value = data || [];
      };

      const tableGroups = computed(() => {
        const groups = {};
        pendingOrders.value.forEach(o => {
          if (!groups[o.table_no]) groups[o.table_no] = [];
          groups[o.table_no].push(o);
        });
        return groups;
      });

      const getCombinedItems = (orders) => {
        const map = {};
        orders.forEach(o => {
          (o.items || []).forEach(i => {
            if (!map[i.name]) map[i.name] = { ...i, qty: 0 };
            map[i.name].qty += Number(i.qty);
          });
        });
        return Object.values(map);
      };

      const getTableGrandTotal = (orders) => {
        return orders.reduce((sum, o) => sum + Number(o.total_amount || 0), 0);
      };

      const currentTotal = computed(() => getTableGrandTotal(currentOrders.value));

      const startCheckout = (tableNo, orders) => {
        currentTable.value = tableNo;
        currentOrders.value = orders;
        payMethod.value = 'Cash';
      };

      const finishCheckout = async () => {
        if (!currentTable.value) return;

        const mergedItems = getCombinedItems(currentOrders.value);
        const ids = currentOrders.value.map(o => o.id);

        // 1. 将所有未结账订单更新为 Paid
        await client.from('orders').update({ status: 'Paid' }).in('id', ids);

        // 2. 插入发票纪录
        await client.from('orders').insert({
          table_no: currentTable.value,
          items: mergedItems,
          total_amount: currentTotal.value,
          payment_method: payMethod.value,
          status: 'Paid',
          is_invoice: true
        });

        currentTable.value = null;
        loadOrders();
      };

      onMounted(() => {
        loadOrders();
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        client.channel('admin-v2').on('postgres_changes', { event: '*', table: 'orders' }, () => {
          loadOrders();
        }).subscribe();
      });

      return { tableGroups, getCombinedItems, getTableGrandTotal, currentTable, currentTotal, payMethod, startCheckout, finishCheckout };
    }
  }).mount('#app');
</script>
</body>
</html>
