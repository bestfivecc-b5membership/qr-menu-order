<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>POS Admin Counter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>[v-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-100 p-6 min-h-screen">

<div id="app" v-cloak class="max-w-7xl mx-auto space-y-6">
  <header class="bg-slate-900 text-white p-5 rounded-2xl shadow-lg flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-black">🖥️ 柜台 POS 系统 (全新纯净版)</h1>
      <p class="text-xs text-slate-400 mt-1">按桌号自动合并汇总 · 独立结账打发票</p>
    </div>
    <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1.5 rounded-full font-bold">● 实时就绪</span>
  </header>

  <!-- 桌号列表 -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div v-for="(orders, tableNo) in groupedTables" :key="tableNo" class="bg-white rounded-2xl shadow-md border p-5 flex flex-col justify-between space-y-4">
      
      <div>
        <div class="flex justify-between items-center border-b pb-3">
          <span class="bg-amber-500 text-white font-black text-2xl px-3 py-1 rounded-xl">
            TABLE: {{ tableNo }}
          </span>
          <span class="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg">
            下单 {{ orders.length }} 次
          </span>
        </div>

        <!-- 菜品自动汇总 -->
        <div class="mt-4 space-y-2 max-h-60 overflow-y-auto">
          <div v-for="item in getMergedItems(orders)" :key="item.name" class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border text-sm">
            <span class="font-bold text-slate-800">{{ item.name }}</span>
            <span class="font-black text-amber-600">x{{ item.qty }}</span>
          </div>
        </div>
      </div>

      <div class="border-t pt-3 space-y-3">
        <div class="flex justify-between items-center font-black">
          <span class="text-slate-500">全单总计:</span>
          <span class="text-2xl text-emerald-600">RM {{ getTableTotal(orders).toFixed(2) }}</span>
        </div>

        <button @click="openCheckout(tableNo, orders)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl shadow transition">
          💳 结账并出发票 (Checkout)
        </button>
      </div>

    </div>

    <div v-if="Object.keys(groupedTables).length === 0" class="col-span-full text-center py-20 bg-white rounded-2xl border text-slate-400 font-bold">
      🍵 当前无未结账桌号
    </div>
  </div>

  <!-- 结账弹窗 -->
  <div v-if="activeTable" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-5">
      <h3 class="text-xl font-black border-b pb-2">桌号 {{ activeTable }} 结账</h3>
      
      <div class="text-center bg-emerald-50 py-3 rounded-2xl border border-emerald-100">
        <div class="text-xs text-emerald-600 font-bold">应收总额</div>
        <div class="text-3xl font-black text-emerald-700">RM {{ activeTotal.toFixed(2) }}</div>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-600">选择支付方式：</label>
        <div class="grid grid-cols-2 gap-2">
          <button v-for="m in ['Cash', 'QR Pay', 'Visa', 'MasterCard']" :key="m"
                  @click="selectedPayment = m"
                  :class="['py-2.5 text-xs font-bold rounded-xl border transition', selectedPayment === m ? 'bg-amber-500 text-white border-amber-500 shadow' : 'bg-slate-50 text-slate-700']">
            {{ m }}
          </button>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button @click="activeTable = null" class="w-1/2 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-xs">取消</button>
        <button @click="confirmCheckout" class="w-1/2 bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs shadow">确认支付并清除</button>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://tswfrncmfidrbndfvimb.supabase.co"; 
  const SUPABASE_KEY = "sb_publishable_85XhLrnf93uEZPuPXOEuqA_7UeG9Wm_";
  const { createApp, ref, computed, onMounted } = Vue;

  createApp({
    setup() {
      const rawOrders = ref([]);
      const activeTable = ref(null);
      const activeOrders = ref([]);
      const selectedPayment = ref('Cash');
      let supabaseClient = null;

      const fetchOrders = async () => {
        if (!supabaseClient) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        // 只查未结账且非发票的订单
        const { data } = await supabaseClient.from('orders')
          .select('*')
          .eq('status', 'Pending')
          .is('is_invoice', null);
        rawOrders.value = data || [];
      };

      const groupedTables = computed(() => {
        const map = {};
        rawOrders.value.forEach(o => {
          if (!map[o.table_no]) map[o.table_no] = [];
          map[o.table_no].push(o);
        });
        return map;
      });

      const getMergedItems = (orders) => {
        const map = {};
        orders.forEach(o => {
          (o.items || []).forEach(i => {
            if (!map[i.name]) map[i.name] = { ...i, qty: 0 };
            map[i.name].qty += Number(i.qty);
          });
        });
        return Object.values(map);
      };

      const getTableTotal = (orders) => {
        return orders.reduce((sum, o) => sum + Number(o.total_amount || 0), 0);
      };

      const activeTotal = computed(() => getTableTotal(activeOrders.value));

      const openCheckout = (tableNo, orders) => {
        activeTable.value = tableNo;
        activeOrders.value = orders;
        selectedPayment.value = 'Cash';
      };

      const confirmCheckout = async () => {
        if (!activeTable.value) return;

        const mergedItems = getMergedItems(activeOrders.value);
        const orderIds = activeOrders.value.map(o => o.id);

        // 1. 将原订单全部更新为 Paid
        await supabaseClient.from('orders').update({ status: 'Paid' }).in('id', orderIds);

        // 2. 插入一条专门触发发票打印的记录
        await supabaseClient.from('orders').insert({
          table_no: activeTable.value,
          items: mergedItems,
          total_amount: activeTotal.value,
          payment_method: selectedPayment.value,
          status: 'Paid',
          is_invoice: true
        });

        activeTable.value = null;
        fetchOrders();
      };

      onMounted(() => {
        fetchOrders();
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        supabaseClient.channel('admin-updates').on('postgres_changes', { event: '*', table: 'orders' }, () => {
          fetchOrders();
        }).subscribe();
      });

      return { groupedTables, getMergedItems, getTableTotal, activeTable, activeTotal, selectedPayment, openCheckout, confirmCheckout };
    }
  }).mount('#app');
</script>
</body>
</html>
