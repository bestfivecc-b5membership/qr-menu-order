<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码点餐</title>
  <!-- 替换为高速稳定的 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.8/supabase.umd.min.js"></script>
  <style>
    [v-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-100 pb-24">

<div id="app" v-cloak class="max-w-md mx-auto min-h-screen bg-white relative shadow-lg">

  <!-- 顶部 Header -->
  <header class="bg-amber-600 text-white p-4 sticky top-0 z-10 flex justify-between items-center shadow">
    <div>
      <h1 class="text-xl font-bold">扫码点餐系统</h1>
      <p class="text-xs opacity-90">当前桌号: <span class="text-yellow-200 font-bold text-base">{{ currentTable }}</span></p>
    </div>
    <div class="text-xs bg-amber-700 px-2 py-1 rounded">
      {{ orderType === 'Dine-In' ? '🍽️ 堂食' : '🛍️ 外带' }}
    </div>
  </header>

  <!-- 错误提示 -->
  <div v-if="errorMessage" class="p-4 m-4 bg-red-100 border border-red-400 text-red-700 text-sm rounded">
    ❌ {{ errorMessage }}
  </div>

  <!-- 加载中提示 -->
  <div v-if="loading && !errorMessage" class="p-8 text-center text-gray-500">
    ⏳ 菜单加载中，请稍候...
  </div>

  <template v-if="!loading && !errorMessage">
    <!-- 分类标签页 -->
    <div class="flex overflow-x-auto bg-gray-50 border-b border-gray-200 sticky top-[60px] z-10 p-2 gap-2">
      <button 
        v-for="cat in categories" 
        :key="cat"
        @click="activeCategory = cat"
        :class="['px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition', 
                activeCategory === cat ? 'bg-amber-600 text-white shadow' : 'bg-white text-gray-600 border border-gray-200']">
        {{ cat }}
      </button>
    </div>

    <!-- 菜品列表 -->
    <div class="p-4 space-y-4">
      <div v-if="filteredMenu.length === 0" class="text-center py-8 text-gray-400">
        该分类下暂无菜品
      </div>

      <div v-for="item in filteredMenu" :key="item.id" class="flex gap-3 bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
        <img :src="item.image_url || 'https://via.placeholder.com/100?text=Food'" class="w-20 h-20 rounded-lg object-cover bg-gray-100" />
        <div class="flex-1 flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-gray-800">{{ item.name }}</h3>
            <p class="text-xs text-gray-400 line-clamp-1">{{ item.description }}</p>
          </div>
          <div class="flex justify-between items-center mt-2">
            <span class="text-amber-600 font-bold">RM {{ Number(item.price).toFixed(2) }}</span>
            <button 
              @click="addToCart(item)"
              :disabled="!item.is_available"
              :class="['px-3 py-1 rounded-lg text-xs font-bold transition', 
                      item.is_available ? 'bg-amber-600 text-white active:scale-95' : 'bg-gray-200 text-gray-400']">
              {{ item.is_available ? '+ 加购' : '售罄' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- 底部购物车 bar -->
  <div v-if="cart.length > 0" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 p-3 flex justify-between items-center shadow-2xl z-20">
    <div class="flex items-center gap-3">
      <div class="relative">
        <span class="text-2xl">🛒</span>
        <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">
          {{ totalCartCount }}
        </span>
      </div>
      <div>
        <div class="text-xs text-gray-500">合计总额</div>
        <div class="text-lg font-bold text-amber-600">RM {{ totalCartPrice.toFixed(2) }}</div>
      </div>
    </div>

    <button 
      @click="submitOrder" 
      :disabled="submitting"
      class="bg-amber-600 text-white px-6 py-2.5 rounded-xl font-bold shadow hover:bg-amber-700 active:scale-95 transition flex items-center gap-2">
      <span>{{ submitting ? '提交中...' : '立即下单' }}</span>
    </button>
  </div>

</div>

<script>
  // 正确填入你的凭证
  const SUPABASE_URL = "https://tswfrncmfidrbndfvimb.supabase.co"; 
  const SUPABASE_KEY = "sb_publishable_85XhLrnf93uEZPuPXOEuqA_7UeG9Wm_";

  const { createApp, ref, computed, onMounted } = Vue;

  createApp({
    setup() {
      const menuList = ref([]);
      const loading = ref(true);
      const submitting = ref(false);
      const errorMessage = ref('');
      const activeCategory = ref('全部');
      const cart = ref([]);
      const currentTable = ref('A01');
      const orderType = ref('Dine-In');

      let supabaseClient = null;

      const getTableFromUrl = () => {
        const params = new URLSearchParams(window.location.search);
        const table = params.get('table');
        if (table) currentTable.value = table;
        const type = params.get('type');
        if (type) orderType.value = type;
      };

      const fetchMenu = async () => {
        try {
          // 初始化 Supabase
          if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          } else {
            throw new Error("Supabase SDK 未能加载，请检查网络条件！");
          }

          const { data, error } = await supabaseClient.from('menu').select('*');
          if (error) throw error;

          if (!data || data.length === 0) {
            errorMessage.value = '数据库中尚无菜单数据，请先在 Supabase 添加菜品。';
          } else {
            menuList.value = data;
          }
        } catch (err) {
          errorMessage.value = '加载失败: ' + (err.message || '网络连接异常');
          console.error(err);
        } finally {
          loading.value = false;
        }
      };

      const categories = computed(() => {
        const cats = ['全部', ...new Set(menuList.value.map(i => i.category))];
        return cats;
      });

      const filteredMenu = computed(() => {
        if (activeCategory.value === '全部') return menuList.value;
        return menuList.value.filter(i => i.category === activeCategory.value);
      });

      const addToCart = (item) => {
        const existing = cart.value.find(c => c.id === item.id);
        if (existing) {
          existing.qty += 1;
        } else {
          cart.value.push({
            id: item.id,
            name: item.name,
            price: Number(item.price),
            printer: item.printer || 'Kitchen',
            qty: 1
          });
        }
      };

      const totalCartCount = computed(() => cart.value.reduce((sum, item) => sum + item.qty, 0));
      const totalCartPrice = computed(() => cart.value.reduce((sum, item) => sum + (item.price * item.qty), 0));

      const submitOrder = async () => {
        if (cart.value.length === 0) return;
        submitting.value = true;

        try {
          const { error } = await supabaseClient.from('orders').insert([
            {
              table_no: currentTable.value,
              order_type: orderType.value,
              items: cart.value,
              total_amount: totalCartPrice.value,
              status: 'Pending'
            }
          ]);

          if (error) throw error;

          await supabaseClient.from('tables').update({ status: 'Occupied' }).eq('table_no', currentTable.value);

          alert(`✅ 下单成功！订单已发送至柜台与厨房，桌号: ${currentTable.value}`);
          cart.value = [];
        } catch (err) {
          alert('❌ 下单失败: ' + err.message);
          console.error(err);
        } finally {
          submitting.value = false;
        }
      };

      onMounted(() => {
        getTableFromUrl();
        fetchMenu();
      });

      return {
        menuList,
        loading,
        submitting,
        errorMessage,
        activeCategory,
        categories,
        filteredMenu,
        cart,
        currentTable,
        orderType,
        addToCart,
        totalCartCount,
        totalCartPrice,
        submitOrder
      };
    }
  }).mount('#app');
</script>

</body>
</html>
